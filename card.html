<!DOCTYPE html>
<html lang="en" >
<head>
    <meta charset="UTF-8">
    <title>PINK ROSE</title>
    <link rel="stylesheet" href="card.css">
   </head>

   
   
 
   <body>

      <header>
        <div class="logo">🌸 Lovely Scents Store</div> 
        <div class="container">
            <nav class="navbar">
            <ul class="navbar-list">
                <a class="navbar-list" href="">الرئيسية</a></li>
                 <a class="navbar-list" href="">المنتجات</a></li>
                  <a class="navbar-list" href="">تواصل معنا</a></li>
                </ul>
                 </div>
                </nav>
                 <div class="header-actions">
                <div class="icon-wrapper">
                    <button class="icon-btn">🛒</button>
                        <i class="fas fa-shopping-cart "></i>
                   
                    <span class="cart-count">3</span>
                </div>
                
                <button class="icon-btn">👤</button>
                    <i class="fas fa-user"></i>

                <button class="icon-btn">🔍</button>

            </div>

    </header>

    <div class="product-card">
        <!-- الصورة الأصلية -->
        <img width="300px" src="images/pert.jpg" alt="Perfume" class="product-image">
        
        <div class="product-info">
            <!-- تطبيق فئة product-title على العنوان -->
            <h2 class="product-title">PINK ROSE</h2>
            
            <!-- تطبيق فئة description على الوصف -->
            <p class="description">
                عطر أنيق بزجاجة وردية شفافة وفيونكة لامعة، يتميز برائحة الروز الجميلة بنفحات زهرية ناعمة تمنح إحساساً بالانتعاش والأنوثة، مناسب للمناسبات والاستخدام اليومي
            </p>
            
            <div class="price-container">
                <span class="price">199 SAR</span>
            </div>
            
            <button class="buy-button">Add to cart</button>
        </div>
    </div>
